[package]
name = "librespot-oauth"
version = "0.5.0"
rust-version.workspace = true
authors = ["Nick Steel <nick@nsteel.co.uk>"]
description = "OAuth authorization code flow with PKCE for obtaining a Spotify access token"
license = "MIT"
repository = "https://github.com/librespot-org/librespot"
edition = "2021"

[dependencies]
log = "0.4"
oauth2 = { version = "4.4", default-features = false }
thiserror = "1.0"
url = "2.2"

[dev-dependencies]
env_logger =  { version = "0.11.2", default-features = false, features = ["color", "humantime", "auto-color"] }
oauth2 = { version = "4.4", features = ["rustls-tls"] }

[features]
rustls-tls = ["oauth2/rustls-tls"]
native-tls = ["oauth2/native-tls"]
default = ["rustls-tls"]